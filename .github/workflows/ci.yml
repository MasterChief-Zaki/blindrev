# BlindRev CI (SPEC §14). Gating jobs never touch the network at test time:
# offline fixtures, seeded data, fixed clocks, fixed cameras.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.30.2"
  CI: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Typecheck, unit tests (incl. geodesy-verify vs Cesium), Biome, asset gates
  # ---------------------------------------------------------------------------
  checks:
    name: Typecheck · Vitest · Biome · asset gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome lint (errors gate; formatting is enforced by the pre-commit hook)
        run: pnpm lint
      - name: tsc --noEmit (all packages)
        run: pnpm -r typecheck
      - name: Vitest (unit + geodesy cross-validation)
        run: pnpm -r test
      - name: Asset manifest gates (licenses, hashes, determinism)
        run: pnpm --filter @blindrev/data-forge verify

  # ---------------------------------------------------------------------------
  # Rust: cargo clippy on the Tauri shell
  # ---------------------------------------------------------------------------
  clippy:
    name: cargo clippy (Tauri shell)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/app-shell/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux system deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app-shell/src-tauri -> target
      - name: Placeholder frontendDist (generate_context! needs it)
        run: mkdir -p ../dist && [ -f ../dist/index.html ] || echo '<!doctype html><title>BlindRev</title>' > ../dist/index.html
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Playwright gating suite on offline deterministic fixtures (?stub=1, OFFLINE)
  # visual diff ≤ 2 % pixels @1080p, keyboard-only ROI, reduced motion, live regions
  # ---------------------------------------------------------------------------
  e2e:
    name: Playwright (gating, offline fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    env:
      BLINDREV_OFFLINE: "1"
      VITE_CESIUM_ION_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build web app
        run: pnpm --filter @blindrev/app-shell build
      - name: Gating suite (no network)
        run: pnpm e2e --grep-invert @streaming
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Streaming World Terrain / GIBS tests — separate and NON-gating
  # ---------------------------------------------------------------------------
  streaming:
    name: Streaming tests (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    continue-on-error: true
    env:
      BLINDREV_STREAMING: "1"
      VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @blindrev/app-shell build
      - run: pnpm e2e --grep @streaming

  # ---------------------------------------------------------------------------
  # Windows WebView2 smoke harness: build the Tauri exe, launch it, confirm a
  # live window process, then build the NSIS installer (unsigned).
  # ---------------------------------------------------------------------------
  windows-smoke:
    name: Windows WebView2 smoke (Tauri)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app-shell/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build desktop exe (web build runs via beforeBuildCommand)
        run: pnpm desktop:build
      - name: Launch smoke (window process alive after 10 s)
        shell: bash
        run: |
          exe=packages/app-shell/src-tauri/target/release/blindrev.exe
          test -f "$exe"
          "$exe" &
          sleep 10
          tasklist //FI "IMAGENAME eq blindrev.exe" | tee tasklist.txt
          grep -qi "blindrev.exe" tasklist.txt
          taskkill //F //IM blindrev.exe
      - name: NSIS installer (unsigned; see docs/reports/packaging.md)
        run: pnpm desktop:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: blindrev-windows
          path: |
            packages/app-shell/src-tauri/target/release/blindrev.exe
            packages/app-shell/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
