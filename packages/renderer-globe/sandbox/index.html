<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlindRev — globe sandbox</title>
    <script>
      window.CESIUM_BASE_URL = new URL("cesium/", document.baseURI).href;
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #0E1020; color: #F3F5F7; font: 13px/1.4 "IBM Plex Sans", system-ui, sans-serif; overflow: hidden; }
      #globe { position: absolute; inset: 0; }
      #panel { position: absolute; top: 12px; right: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; z-index: 5;
        background: rgba(28,32,54,0.92); border-radius: 12px; padding: 12px; box-sizing: border-box; }
      #panel.hidden { display: none; }
      #panel h2 { font: 600 14px/1.2 Outfit, system-ui, sans-serif; margin: 0 0 8px; }
      #panel button, #panel select { font: inherit; color: #F3F5F7; background: #0E1020; border: 1px solid #3DE0D0; border-radius: 8px; padding: 4px 8px; margin: 2px; cursor: pointer; }
      #panel button:focus-visible { outline: 2px solid #3DE0D0; outline-offset: 3px; }
      #panel label { display: inline-flex; gap: 4px; align-items: center; margin: 2px 6px 2px 0; }
      #panel .row { margin: 6px 0; }
      #status { white-space: pre-wrap; font: 11px/1.35 "IBM Plex Mono", ui-monospace, monospace; color: #F3F5F7; opacity: 0.85; }
      #probe { position: absolute; left: 12px; top: 12px; z-index: 5; font: 12px "IBM Plex Mono", ui-monospace, monospace; background: rgba(14,16,32,0.8); padding: 4px 8px; border-radius: 8px; }
      #probe.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="globe"></div>
    <div id="probe">—</div>
    <div id="panel">
      <h2>Globe sandbox</h2>
      <div class="row" id="stepRow"></div>
      <div class="row" id="layerRow"></div>
      <div class="row" id="actionRow"></div>
      <div id="status"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
